name: Lint

on:
  push:
    branches: [main, 3.x]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      # Yarn packs the GitHub dependencies with Yarn Classic, in parallel on a
      # shared cache: on a cold cache the runs corrupt each other (ENOENT).
      - name: Serialize Yarn Classic runs
        run: echo "--mutex \"file:${RUNNER_TEMP}/yarn-classic.lock\"" >> ~/.yarnrc

      # --immutable fails if yarn.lock is out of sync with package.json
      - name: Install dependencies
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint .

      - name: Prettier
        run: yarn prettier

      - name: Stylelint
        run: yarn stylelint
